name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_PATH: /docs/sva-dvc-3342a-slide-deck
  VITE_CANONICAL_URL: https://palewi.re/docs/sva-dvc-3342a-slide-deck/

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build site
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run browser tests
        run: pnpm test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: deploy-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: build/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref_name == 'main' }}
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.DOCS_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DOCS_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DOCS_AWS_REGION }}

      - name: Upload site to Amazon S3
        uses: datadesk/delivery-deploy-action@v1
        with:
          bucket: ${{ secrets.DOCS_AWS_BUCKET }}
          # Repo-name-only path; the Cloudflare reverse proxy adds the docs/ prefix, unlike BASE_PATH above.
          base-path: ${{ vars.DOCS_AWS_BASE_PATH }}
          dir: build/
          should-cache: false
          use-accelerate-endpoint: false
          public: true
